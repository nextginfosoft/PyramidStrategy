services:
  db:
    image: postgres:15-alpine
    container_name: pyramid_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pyramidstrategy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: pyramid_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: pyramid_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:password@db:5432/pyramidstrategy
      - REDIS_URL=redis://redis:6379/0
      - USE_FAKE_REDIS=false
      - PAPER_TRADE=true
      - SECRET_KEY=prod-secret-key-change-this-in-env
      - ENCRYPTION_KEY=prod-encryption-key-32-chars!!
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=https://pyramid.nextginfosoft.com/api
        - VITE_WS_URL=wss://pyramid.nextginfosoft.com/ws
    container_name: pyramid_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
