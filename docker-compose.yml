services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pyramidstrategy
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build: ./backend
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:password@db:5432/pyramidstrategy
      - REDIS_URL=redis://redis:6379/0
      - USE_FAKE_REDIS=false
      - PAPER_TRADE=true
      - SECRET_KEY=prod-secret-key-change-this-in-env
      - ENCRYPTION_KEY=prod-encryption-key-32-chars!!
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-santosh}
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=https://pyramid.nextginfosoft.com/api
        - VITE_WS_URL=wss://pyramid.nextginfosoft.com/ws
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data:
